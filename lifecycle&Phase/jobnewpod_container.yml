apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retry-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: controlled-retry-job
spec:
  backoffLimit: 3   # allow new pod creation
  template:
    spec:
      restartPolicy: OnFailure   # 👈 required
      containers:
      - name: retry-container
        image: busybox
        volumeMounts:
        - name: data
          mountPath: /data
        command:
        - sh
        - -c
        - |
          COUNT_FILE=/data/count

          if [ ! -f $COUNT_FILE ]; then
            echo 1 > $COUNT_FILE
          fi

          COUNT=$(cat $COUNT_FILE)
          echo "Run number: $COUNT"

          # First 3 attempts → fail
          if [ "$COUNT" -le 3 ]; then
            echo $((COUNT+1)) > $COUNT_FILE
            echo "Failing..."
            exit 1
          else
            echo "Success in new Pod!"
            exit 0
          fi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: retry-pvc
